name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel -d hotel_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg2://hotel:hotel@localhost:5432/hotel_test
          SECRET_KEY: ci-only-secret
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg2://hotel:hotel@localhost:5432/hotel_test
          SECRET_KEY: ci-only-secret
          ADMIN_PASSWORD: CI-Only-Password-123!
